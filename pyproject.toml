[project]
name = "neonwhisper"
dynamic = ["version"]  # la version la manda neonwhisper/__init__.py
description = "Dictado por voz 100% local con Whisper: presiona tu atajo, habla y el texto se pega donde está tu cursor."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "faster-whisper>=1.1.1",
    "PySide6-Essentials>=6.7",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "keyboard>=0.13.5",
    # Librerías CUDA 12 para correr Whisper en GPU NVIDIA (se ignoran si no hay GPU).
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
]

# Instala el paquete en el entorno: asi uv crea .venv\Scripts\NeonWhisper.exe, el ejecutable
# que ve Windows (accesos directos, barra de tareas, inicio con Windows).
[project.gui-scripts]
NeonWhisper = "neonwhisper.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "neonwhisper/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["neonwhisper"]
